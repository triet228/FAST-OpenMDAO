[project]
name = "fast-openmdao"
version = "0.1.0"
description = "OpenMDAO integration layer for the Future Aircraft Sizing Tool."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26",
    "openmdao>=3.36",
    "scipy>=1.12",
]

[project.scripts]
fast-openmdao-compact = "fast_openmdao.examples.compact_electric:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
